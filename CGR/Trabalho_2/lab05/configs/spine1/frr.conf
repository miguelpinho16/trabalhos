frr defaults datacenter
hostname spine1
log syslog informational
service integrated-vtysh-config
!
router bgp 65000
 bgp router-id 10.0.0.1
 neighbor LEAVES peer-group
 neighbor LEAVES remote-as external
 neighbor 10.1.1.1 peer-group LEAVES
 neighbor 10.1.1.1 description leaf1
 neighbor 10.1.2.1 peer-group LEAVES
 neighbor 10.1.2.1 description leaf2
 neighbor 10.1.3.1 peer-group LEAVES
 neighbor 10.1.3.1 description leaf3
 neighbor 10.1.4.1 peer-group LEAVES
 neighbor 10.1.4.1 description leaf4
 !
 address-family ipv4 unicast
  network 10.0.0.1/32
 exit-address-family
 !
 address-family l2vpn evpn
  neighbor LEAVES activate
 exit-address-family
exit
!
end
