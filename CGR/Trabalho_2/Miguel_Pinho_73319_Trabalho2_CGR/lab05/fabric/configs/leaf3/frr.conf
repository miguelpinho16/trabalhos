frr defaults datacenter
hostname leaf3
log syslog informational
service integrated-vtysh-config
!
vrf RED
 vni 5001
exit-vrf
!
router bgp 65103
 bgp router-id 10.0.0.13
 neighbor SPINES peer-group
 neighbor SPINES remote-as external
 neighbor 10.1.3.0 peer-group SPINES
 neighbor 10.1.3.0 description spine1
 neighbor 10.2.3.0 peer-group SPINES
 neighbor 10.2.3.0 description spine2
 !
 address-family ipv4 unicast
  network 10.0.0.13/32
 exit-address-family
 !
 address-family l2vpn evpn
  neighbor SPINES activate
  advertise-all-vni
 exit-address-family
exit
!
router bgp 65103 vrf RED
 !
 address-family ipv4 unicast
  redistribute connected
 exit-address-family
 !
 address-family l2vpn evpn
  advertise ipv4 unicast
 exit-address-family
exit
!
end
