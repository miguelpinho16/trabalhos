frr defaults datacenter
hostname spine2
log syslog informational
service integrated-vtysh-config
!
router bgp 65000
 bgp router-id 10.0.0.2
 neighbor LEAVES peer-group
 neighbor LEAVES remote-as external
 neighbor 10.2.1.1 peer-group LEAVES
 neighbor 10.2.1.1 description leaf1
 neighbor 10.2.2.1 peer-group LEAVES
 neighbor 10.2.2.1 description leaf2
 neighbor 10.2.3.1 peer-group LEAVES
 neighbor 10.2.3.1 description leaf3
 neighbor 10.2.4.1 peer-group LEAVES
 neighbor 10.2.4.1 description leaf4
 !
 address-family ipv4 unicast
  network 10.0.0.2/32
 exit-address-family
 !
 address-family l2vpn evpn
  neighbor LEAVES activate
 exit-address-family
exit
!
end
